name: Publish GUI fix image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out GUI source
        uses: actions/checkout@v4
        with:
          repository: Data-Space-Lab/DIL-Connector-source
          ref: fix/osm-map-tiles
          path: source

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ./source/Connector_GUI
          file: ./source/Connector_GUI/Dockerfile
          push: true
          tags: ghcr.io/data-space-lab/dil-connector-gui:osm-map-20261102-1
